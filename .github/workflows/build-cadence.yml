name: Build Cadence web frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Enzonic-Geometry-Dash-Full-Frontend-Source.zip'
      - '.github/workflows/build-cadence.yml'
      - '.github/build-trigger.txt'
      - 'web-enhancements/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
          mkdir -p "$RUNNER_TEMP/cadence-source"
          unzip -q Enzonic-Geometry-Dash-Full-Frontend-Source.zip -d "$RUNNER_TEMP/cadence-source"

      - name: Inspect frontend entrypoint
        working-directory: ${{ runner.temp }}/cadence-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("index.html", "site.js", "cadence-main/web/index.html"):
              p = Path(name)
              print(f"\\n===== {name} =====")
              if p.exists():
                  text = p.read_text(errors="replace")
                  print(text[:18000])
              else:
                  print("MISSING")
          PY

      - name: Study native Cadence menus, levels, and player data
        working-directory: ${{ runner.temp }}/cadence-source
        run: |
          python3 - <<'PY' | tee "$RUNNER_TEMP/native-integration-study.txt"
          from pathlib import Path
          import re
          root = Path(".")
          exts = {".rs", ".js", ".ts", ".html", ".css", ".json", ".toml"}
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in exts and not any(x in p.parts for x in ("target", "node_modules", ".git"))]
          print("===== SOURCE FILE MAP: MENU / LEVEL / PLAYER / ACCOUNT =====")
          for p in files:
              if re.search(r"menu|level|player|profile|account|user|save|leader|community", str(p), re.I):
                  print(f"{p} ({p.stat().st_size} bytes)")
          patterns = re.compile(r"community|level.?select|main.?menu|menu.?screen|struct .*Level|enum .*Level|fn .*level|struct .*Player|struct .*User|FileStore|level.?list|level.?data|account|profile", re.I)
          print("\\n===== NATIVE IMPLEMENTATION MATCHES (context excerpts) =====")
          count = 0
          for p in files:
              if p.suffix not in {".rs", ".js", ".ts", ".html"}:
                  continue
              try: lines = p.read_text(errors="replace").splitlines()
              except Exception: continue
              hits = [i for i, line in enumerate(lines) if patterns.search(line)]
              if not hits: continue
              print(f"\\n--- {p} ({len(hits)} matches) ---")
              chosen = set()
              for i in hits[:12]:
                  chosen.update(range(max(0, i-2), min(len(lines), i+3)))
              for i in sorted(chosen):
                  print(f"{i+1}: {lines[i][:240]}")
                  count += 1
                  if count >= 260: break
              if count >= 260: break
          print(f"\\nStudy complete: scanned {len(files)} source files; emitted {count} context lines.")
          PY

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Cadence WebAssembly
        working-directory: ${{ runner.temp }}/cadence-source/cadence-main
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          bash ./tools/build-web.sh

      - name: Assemble website artifact
        working-directory: ${{ runner.temp }}/cadence-source
        run: |
          test -f index.html
          test -f site.js
          test -f cadence-main/web/pkg/cadence_game.js
          test -f cadence-main/web/pkg/cadence_game_bg.wasm
          mkdir -p "$GITHUB_WORKSPACE/site-artifact/pkg"
          cp index.html site.js "$GITHUB_WORKSPACE/site-artifact/"
          cp cadence-main/web/pkg/cadence_game.js cadence-main/web/pkg/cadence_game_bg.wasm "$GITHUB_WORKSPACE/site-artifact/pkg/"
          if [ -d cadence-main/web/assets ]; then
            cp -R cadence-main/web/assets "$GITHUB_WORKSPACE/site-artifact/assets"
          fi


      - name: Download and extract Geometry Dash Resources
        timeout-minutes: 25
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/definitelynotguru/mf-dl.git "$RUNNER_TEMP/mf-dl"
          python3 -m venv "$RUNNER_TEMP/mf-venv"
          "$RUNNER_TEMP/mf-venv/bin/pip" install requests
          printf '%s\\n' 'https://www.mediafire.com/file/rtsqfba3veok2c2/Resources.zip/file' > "$RUNNER_TEMP/mediafire-links.txt"
          "$RUNNER_TEMP/mf-venv/bin/python" "$RUNNER_TEMP/mf-dl/mfdl.py" "$RUNNER_TEMP/mediafire-downloads" "$RUNNER_TEMP/mediafire-links.txt"
          ZIP_FILE="$(find "$RUNNER_TEMP/mediafire-downloads" -type f -name 'Resources.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/resources-unpacked"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/resources-unpacked"
          LEVEL_FILE="$(find "$RUNNER_TEMP/resources-unpacked" -type f -path '*/levels/1.txt' -print -quit)"
          test -n "$LEVEL_FILE"
          RESOURCE_ROOT="$(dirname "$(dirname "$LEVEL_FILE")")"
          echo "Detected Resources root: $RESOURCE_ROOT"
          mkdir -p "$GITHUB_WORKSPACE/site-artifact/Resources"
          cp -a "$RESOURCE_ROOT/." "$GITHUB_WORKSPACE/site-artifact/Resources/"
          test -f "$GITHUB_WORKSPACE/site-artifact/Resources/levels/1.txt"
          echo "Resources files: $(find "$GITHUB_WORKSPACE/site-artifact/Resources" -type f | wc -l)"
          du -sh "$GITHUB_WORKSPACE/site-artifact/Resources"

      - name: Configure automatic Resources loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site-artifact/index.html")
          s = p.read_text()
          old = 'let source = null; // { read(path) -> Promise<Uint8Array|null> }'
          new = """let source = {
            read: async (p) => {
              const r = await fetch(new URL("Resources/" + p, document.baseURI));
              return r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
            }
          }; // bundled Resources are loaded automatically
          (async () => {
            const check = await source.read("levels/1.txt");
            if (check) {
              status("Game resources loaded automatically. Choose a level and press Play.");
              $("play").disabled = false;
              window.dispatchEvent(new Event("cadence:resources-ready"));
            } else {
              status("The bundled Resources could not be loaded. Check the site deployment includes the Resources folder.", true);
            }
          })();"""
          if old not in s:
              raise SystemExit("Could not find Cadence resource source declaration")
          s = s.replace(old, new, 1)
          s = s.replace('Drop the Geometry Dash folder here, or choose it.', 'Game files are bundled with this website and load automatically.')
          s = s.replace('Steam on Mac: right-click Geometry Dash in your library, Manage, Browse local files, then drop the app. On Windows, drop the Geometry Dash folder.', 'No folder selection is needed.')
          s = s.replace('<button type="button" id="pick">Choose folder</button>', '<button type="button" id="pick" hidden>Choose folder</button>')
          # Keep the existing Cadence canvas UI as the only account/community interface.
          native_ui_style = '<style id="cadence-native-ui-only">#community,#account,.site-nav .nav-links{display:none!important}</style>'
          native_relay = '<script>window.CADENCE_RELAY="/relay";</script>'
          if 'id="cadence-native-ui-only"' not in s:
              s = s.replace("</head>", native_relay + native_ui_style + "\n</head>", 1)
          p.write_text(s)
          PY


      - name: Run desktop and mobile browser smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node .github/scripts/browser-smoke.mjs

      - name: Upload native integration source study
        uses: actions/upload-artifact@v4
        with:
          name: cadence-native-integration-study
          path: study-artifact/

      - name: Upload playable website
        uses: actions/upload-artifact@v4
        with:
          name: cadence-geometrydash-frontend
          path: site-artifact/
